name: CI

# Build Vysara warning-free, run its tests, and check that it stays NativeAOT-clean. Everything here is CPU-only: the
# gallery goldens are drawn by the CPU reference rasterizer (BinaryVibrance.Vysara.Rasterizer), so no GPU is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # A Windows runner: BinaryVibrance.Vysara.Gallery targets net11.0-windows (CsWin32), the HarfBuzz tests need its Windows-only
    # native library, and the NativeAOT link needs MSVC. Its architecture is detected below rather than assumed.
    #
    # A pull request from a fork runs on a GitHub-hosted runner. Everything else (pushes to main, dispatches, and pull
    # requests from this repository's own branches, which only someone with write access can push) runs on the
    # self-hosted one the engine's CI uses.
    # SECURITY: a fork's pull request runs the workflow files on its own branch, so it could change this line. What
    # keeps it off the self-hosted runner is the repository's setting that a fork's workflows wait for approval
    # (Settings > Actions > General, "Require approval for all external contributors"): read a fork's workflow changes
    # before approving its run.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'windows-latest' || fromJSON('["self-hosted", "windows"]') }}

    steps:
      # external/RoseMcp.Tap (the RoseMCP tap contract BinaryVibrance.Vysara.RoseTap builds against) is a public submodule, so the
      # default token fetches it.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      # The runtime identifier this runner runs, for the NativeAOT publishes below.
      - name: Detect runtime
        id: rid
        shell: pwsh
        run: |
          $rid = [System.Runtime.InteropServices.RuntimeInformation]::RuntimeIdentifier
          Write-Host "Runner runtime: $rid"
          "rid=$rid" >> $env:GITHUB_OUTPUT

      # Warnings are errors, as in Kaldra. The IsAotCompatible projects (Vysara, BinaryVibrance.Vysara.Text, BinaryVibrance.Vysara.Rasterizer, the
      # diagnostics endpoint) turn on the trim/AOT/single-file analyzers, so an AOT-unsafe pattern fails here.
      - name: Build (warnings as errors)
        run: dotnet build BinaryVibrance.Vysara.slnx -c Release -p:TreatWarningsAsErrors=true

      # TUnit test apps on Microsoft.Testing.Platform, run directly (Vysara has no global.json opting `dotnet test` into
      # MTP mode). BinaryVibrance.Vysara.Tests includes the CPU-rasterized gallery goldens.
      - name: Test (BinaryVibrance.Vysara.Tests)
        run: dotnet run --project BinaryVibrance.Vysara.Tests -c Release --no-build

      # The configuration a game ships with: BinaryVibrance.Vysara.Diagnostics never turned on, in a process of its own.
      - name: Test (BinaryVibrance.Vysara.Tests.DiagnosticsOff)
        run: dotnet run --project BinaryVibrance.Vysara.Tests.DiagnosticsOff -c Release --no-build

      # NativeAOT-publishes BinaryVibrance.Vysara.RoseTap.Sample, fails on any IL2026/IL3050 from Vysara's own code, and runs it to
      # check Diagnostics.Enabled folds to false under AOT. See the script's header.
      - name: NativeAOT gate (RoseTap sample)
        shell: pwsh
        run: ./tools/check-aot.ps1 -Runtime ${{ steps.rid.outputs.rid }}

      # The diagnostics-off tests NativeAOT-published and run, as a shipped game would be. The static-graph restore keeps
      # PublishAot from reaching the netstandard2.0 XAML source generator (NETSDK1207). Warnings are reported rather
      # than made errors so they can be sorted by where they come from: one from a file in this repository fails the
      # step, while third-party ones (Shouldly's IL2104/IL3053) are listed only.
      #
      # BinaryVibrance.Vysara.Tests itself is not published here: its XAML-generator tests read reference assemblies through
      # Assembly.Location, which is empty under NativeAOT, and its diagnostics tests need the switch NativeAOT forces off.
      - name: NativeAOT publish + run (BinaryVibrance.Vysara.Tests.DiagnosticsOff)
        shell: pwsh
        run: |
          if (-not (Get-Command vswhere.exe -ErrorAction SilentlyContinue))
          {
              $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
              if (Test-Path "$installer\vswhere.exe") { $env:PATH = "$installer;$env:PATH" }
          }
          $rid = '${{ steps.rid.outputs.rid }}'
          $out = "artifacts/aot-tests-off/$rid"
          $log = dotnet publish BinaryVibrance.Vysara.Tests.DiagnosticsOff -c Release -r $rid -o $out `
              -p:PublishAot=true -p:RestoreUseStaticGraphEvaluation=true -p:TreatWarningsAsErrors=false 2>&1 |
              ForEach-Object { "$_" }
          if ($LASTEXITCODE -ne 0) { $log; throw "the NativeAOT publish failed (dotnet exited $LASTEXITCODE)" }

          $root = (Resolve-Path .).Path
          $warnings = @($log | Where-Object { $_ -match '\bwarning (IL|CS)\d+' } | Sort-Object -Unique)
          $ours = @($warnings | Where-Object { $_.TrimStart().StartsWith($root, [StringComparison]::OrdinalIgnoreCase) })
          $warnings | Where-Object { $_ -notin $ours } | ForEach-Object { Write-Host "  (third-party) $_" }
          if ($ours.Count -gt 0)
          {
              $ours | ForEach-Object { Write-Host "::error::$_" }
              throw "the NativeAOT publish reports $($ours.Count) warning(s) from this repository"
          }

          Push-Location $out
          try
          {
              & "./BinaryVibrance.Vysara.Tests.DiagnosticsOff.exe"
              if ($LASTEXITCODE -ne 0) { throw "the NativeAOT test run failed (exit $LASTEXITCODE)" }
          }
          finally { Pop-Location }
